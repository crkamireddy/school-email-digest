name: School Email Digest

on:
  schedule:
    # Backstop only: the main trigger is tools/gmail-trigger.gs, which
    # starts a run within minutes of a labeled email arriving (README
    # Part 3). This catches anything that script misses — if it stops,
    # or its GitHub token expires — every 6 hours, ~120 runs a month.
    # Format is 'minute hour day month weekday' (UTC).
    #
    # Not using the Gmail trigger? Run more often instead: every 2 hours
    # ('17 */2 * * *', ~370 Actions minutes a month) suits a private
    # repo's 2,000 free minutes; a public repo's minutes are free.
    # See the README, Part 2 step 7.
    #
    # The odd minute is deliberate: GitHub queues scheduled runs and
    # starts them when it has capacity, and :00 / :30 are when most of
    # the world's schedules fire — runs there were starting 3–4 hours
    # late and occasionally not at all. Off-peak minutes help but aren't
    # a guarantee; a late run still catches up on everything since the
    # last one.
    - cron: '17 */6 * * *'
  # Manual runs from GitHub's Actions tab (for testing), and the Gmail
  # trigger, which calls the same thing through GitHub's API with
  # trigger set to 'gmail'.
  workflow_dispatch:
    inputs:
      trigger:
        description: Who started this run (leave as manual)
        default: manual
        type: string

# Only one digest run at a time. Two overlapping runs would read the same
# cursor and sent log, post the same emails twice, and then each upload
# its own sent log — the last upload silently erasing the other's
# records. A run that starts while another is going waits instead
# (cancel-in-progress: false, so a run is never cut off mid-post).
# GitHub keeps at most one waiting run; if another arrives, it replaces
# the waiting one, which is fine — each run catches up on everything
# since the last cursor.
concurrency:
  group: school-email-digest
  cancel-in-progress: false

jobs:
  run-digest:
    # Off switch: scheduled and Gmail-triggered runs are skipped until
    # the repository variable DIGEST_ENABLED is set to true (Settings →
    # Secrets and variables → Actions → Variables). Without it, a copy
    # made from the template would fail on every run before setup is
    # done, and deleting it pauses the digest. Manual runs from the
    # Actions tab always go, for testing.
    if: (github.event_name == 'workflow_dispatch' && inputs.trigger != 'gmail') || vars.DIGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reconstruct credentials from secrets
        # Secrets are base64-encoded before being stored, and decoded
        # here — avoids shell-escaping problems with quotes/special
        # characters that real JSON and YAML content routinely contain.
        run: |
          echo "${{ secrets.GMAIL_TOKEN_JSON_B64 }}" | base64 --decode > token.json
          echo "${{ secrets.SCHOOL_DIGEST_CONFIG_YAML_B64 }}" | base64 --decode > config.yaml

      - name: Run the digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python run.py
